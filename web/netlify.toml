# Netlify build + deploy config for the static client (planning.md §12,
# docs/deployment.md). This file is the whole "deploy.yml" this project
# needs — Netlify's own git integration reads it and builds + publishes on
# every push to main, with a deploy preview on every PR for free.
#
# `base = "web"` scopes the build to this directory, so Netlify never sees
# `engine/` or `engine/fixtures/` (the plaintext answer key) at all — that
# exclusion is structural, not something to remember.

[build]
  base = "web"
  publish = "dist"
  # `npm run build` already chains tsc -> vite build -> assert-no-admin
  # (package.json); running the test suite first is one line of cheap
  # insurance in case a change ever reaches main without going through a
  # PR that test.yml would have gated.
  command = "npm run test && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Vite fingerprints every filename under /assets/ with a content hash, so a
# cached copy can never go stale -- a change ships under a new URL, not this
# one. Long cache here is pure repeat-visit speed, not a staleness risk.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Covers both manifest.json (mutable -- its `count` grows with every export
# batch, docs/deployment.md §5.3) and dated puzzle files, which never change
# once they exist -- but Netlify applies a `[[headers]]` rule by path glob to
# every response for that path, 404s included, and `linkage export` ships
# puzzles in batches ahead of time. A date that 404s today can turn into a
# real file next week's export, and `immutable` on that 404 would cache "no
# puzzle" for a year, past the point the file starts existing (caught
# 2026-09-16: a browser that checked before that day's export had run never
# saw the puzzle after it landed, even hours later). Short + must-revalidate
# means a stale 404 self-heals within five minutes instead of a year.
[[headers]]
  for = "/puzzles/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
