# Netlify build + deploy config for the static client (planning.md §12,
# docs/deployment.md). This file is the whole "deploy.yml" this project
# needs — Netlify's own git integration reads it and builds + publishes on
# every push to main, with a deploy preview on every PR for free.
#
# `base = "web"` scopes the build to this directory, so Netlify never sees
# `engine/` or `engine/fixtures/` (the plaintext answer key) at all — that
# exclusion is structural, not something to remember.

[build]
  base = "web"
  publish = "dist"
  # `npm run build` already chains tsc -> vite build -> assert-no-admin
  # (package.json); running the test suite first is one line of cheap
  # insurance in case a change ever reaches main without going through a
  # PR that test.yml would have gated.
  command = "npm run test && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Vite fingerprints every filename under /assets/ with a content hash, so a
# cached copy can never go stale -- a change ships under a new URL, not this
# one. Long cache here is pure repeat-visit speed, not a staleness risk.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dated puzzle files (2026-10-01.json etc.) are each a distinct, never-changing
# URL once shipped, so caching them for as long as a browser will keep them is
# pure speed with no staleness risk. manifest.json is the one path under
# /puzzles/ this rule must NOT catch -- its `count` grows with every export
# batch (docs/deployment.md §5.3) -- so the narrower, short-cache rule for it
# is declared after this one to win the match.
[[headers]]
  for = "/puzzles/*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/puzzles/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
