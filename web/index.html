<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linkage — A Daily Word Connection Puzzle</title>
    <meta name="description" content="A daily mini word puzzle about the hidden connective tissue between ideas. Connect a start word to an end word with a chain of four." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://linkage-daily.netlify.app/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/apple-touch-icon.png" type="image/png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter — planning.md 2.5's sharing requirement makes the
         link preview part of the product, not an afterthought. 1200x630 is
         the standard link-preview banner ratio (1.91:1) -- the previous
         875x875 square rendered as an oversized card on WhatsApp/iMessage;
         summary_large_image is the correct twitter:card for that ratio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Linkage" />
    <meta property="og:title" content="Linkage — A Daily Word Connection Puzzle" />
    <meta property="og:description" content="A daily mini word puzzle about the hidden connective tissue between ideas. Connect a start word to an end word with a chain of four." />
    <meta property="og:url" content="https://linkage-daily.netlify.app/" />
    <meta property="og:image" content="https://linkage-daily.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linkage — A Daily Word Connection Puzzle" />
    <meta name="twitter:description" content="A daily mini word puzzle about the hidden connective tissue between ideas." />
    <meta name="twitter:image" content="https://linkage-daily.netlify.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Linkage",
        "url": "https://linkage-daily.netlify.app/",
        "description": "A daily mini word puzzle about the hidden connective tissue between ideas. Connect a start word to an end word with a chain of four.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!--
      Applies the stored theme before the browser paints (docs/design.md 2.1).

      This has to be inline and synchronous. The preference lives in
      localStorage, localStorage is only reachable from JS, and anything that
      waits for React means every load paints the wrong background first -- a
      white flash for someone who chose dark, which is exactly the person who
      chose dark to avoid it. ~120 bytes, no request.

      The key is `THEME_KEY` in src/engine/types.ts; tests/theme.test.ts keeps
      the two in step. try/catch because Safari private mode throws on access.
      Anything other than light/dark is ignored, so `system` and any garbage
      both fall through to `color-scheme: light dark`.
    -->
    <script>
      try {
        var t = localStorage.getItem('linkage:v1:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
